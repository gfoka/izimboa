spring:
  application:
    name: izimboa-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/izimboa}
    username: ${DB_USER:izimboa}
    password: ${DB_PASSWORD:izimboa}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # Un schéma par module (+ common). Flyway les crée ; seul ce compte écrit les migrations.
    schemas: common,delivery
    default-schema: common
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8081/realms/izimboa}
          audiences: izimboa-api
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

izimboa:
  delivery:
    # Vol d'oiseau × 1,35 ≈ distance par la route (en attendant notre moteur d'itinéraires OpenStreetMap).
    road-factor: 1.35
    # Villes desservies (rectangles simples, remplacés plus tard par de vraies zones).
    # Ramassage et livraison doivent être dans la même ville.
    service-areas:
      - name: Douala            # Bonabéri compris
        south: 3.90
        north: 4.20
        west: 9.55
        east: 9.90
      - name: Yaoundé
        south: 3.70
        north: 4.00
        west: 11.38
        east: 11.65
    tracking-base-url: https://delivery.izimboa.com/suivi/
  mail:
    # Clé de l'API Brevo (e-mails transactionnels). Vide = e-mails seulement inscrits au journal.
    brevo-api-key: ${BREVO_API_KEY:}
    from: ${MAIL_FROM:noreply@izimboa.com}
    from-name: Izimboa
    # Adresse qui reçoit les demandes des formulaires du site.
    team: ${MAIL_TEAM:contact@izimboa.com}
  whatsapp:
    # Jeton permanent de l'utilisateur système Meta « izimboa-serveur ». Vide = envoi WhatsApp désactivé.
    token: ${WHATSAPP_TOKEN:}
    # Numéro +237 6 72 76 99 08 (compte WhatsApp 112090771912051), modèle d'authentification FR/EN.
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:112115108576086}
    code-template: izimboa_code
  cors:
    # *.izimboa.pages.dev : préversions Cloudflare Pages du site (relecture avant mise en ligne).
    allowed-origin-patterns: https://izimboa.com,https://*.izimboa.com,https://*.izimboa.pages.dev,http://localhost:3000,http://localhost:3001
