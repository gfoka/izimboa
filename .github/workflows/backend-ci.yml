name: Backend (tests)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Tests unitaires, frontières entre modules (Spring Modulith) et tests d'intégration
      # sur un vrai PostgreSQL lancé par Testcontainers (Docker est disponible sur le runner).
      - name: Compiler et tester
        run: ./gradlew build --no-daemon
      - name: Rapport de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: backend/build/reports/tests/test
