# Met à jour le profil du numéro WhatsApp Izimboa par l'API : textes (infra/whatsapp/profile/profile.json)
# et photo (infra/whatsapp/profile/izimboa-profil.png).
name: Profil WhatsApp

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    env:
      APP_ID: "3769090063229208"
      PHONE_ID: "112115108576086"
      GRAPH: https://graph.facebook.com/v21.0
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Textes du profil
        run: |
          r=$(curl -s -X POST "$GRAPH/$PHONE_ID/whatsapp_business_profile" -H "Authorization: Bearer $WHATSAPP_TOKEN" \
            -H 'Content-Type: application/json' --data @infra/whatsapp/profile/profile.json)
          echo "::notice title=textes::$(echo "$r" | jq -c '{success, error: (.error.error_user_msg // .error.message)}')"
          p=$(curl -s -G "$GRAPH/$PHONE_ID/whatsapp_business_profile" -H "Authorization: Bearer $WHATSAPP_TOKEN" \
            --data-urlencode 'fields=about,description,email,websites,vertical')
          echo "::notice title=profil actuel::$(echo "$p" | jq -c '.data[0]')"
      - name: Photo de profil
        run: |
          f=infra/whatsapp/profile/izimboa-profil.png
          size=$(stat -c %s "$f")
          s=$(curl -s -X POST "$GRAPH/$APP_ID/uploads?file_length=$size&file_type=image/png&file_name=izimboa-profil.png" -H "Authorization: Bearer $WHATSAPP_TOKEN")
          echo "::notice title=session::$(echo "$s" | jq -c '{id, error: .error.message}')"
          sid=$(echo "$s" | jq -r .id)
          u=$(curl -s -X POST "$GRAPH/$sid" -H "Authorization: OAuth $WHATSAPP_TOKEN" -H "file_offset: 0" --data-binary @"$f")
          echo "::notice title=envoi::$(echo "$u" | jq -c '{ok: (.h != null), error: .error.message}')"
          h=$(echo "$u" | jq -r .h)
          r=$(curl -s -X POST "$GRAPH/$PHONE_ID/whatsapp_business_profile" -H "Authorization: Bearer $WHATSAPP_TOKEN" \
            -H 'Content-Type: application/json' -d "{\"messaging_product\":\"whatsapp\",\"profile_picture_handle\":\"$h\"}")
          echo "::notice title=profil::$(echo "$r" | jq -c '{success, error: (.error.error_user_msg // .error.message)}')"
          p=$(curl -s -G "$GRAPH/$PHONE_ID/whatsapp_business_profile" -H "Authorization: Bearer $WHATSAPP_TOKEN" --data-urlencode 'fields=profile_picture_url')
          echo "::notice title=photo actuelle::$(echo "$p" | jq -r '.data[0].profile_picture_url // "aucune"' | cut -c1-80)"
