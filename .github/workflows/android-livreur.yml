name: Application livreur (Android)

# À chaque modification : tests, puis APK de test téléchargeable (onglet Actions > ce workflow > Artifacts).
# Quand les secrets Google Play existent : application signée envoyée sur la piste de test interne.
on:
  push:
    branches: [main]
    paths:
      - "mobile/livreur-android/**"
      - ".github/workflows/android-livreur.yml"
  workflow_dispatch:

concurrency:
  group: android-livreur
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/livreur-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests et APK de test
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Publier l'APK de test
        uses: actions/upload-artifact@v4
        with:
          name: izimboa-livreur-debug-${{ github.run_number }}
          path: mobile/livreur-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Version signée pour Google Play (si les secrets sont configurés)
        id: release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Pas encore de clé de signature : étape ignorée (voir docs/09-configurations.md, section Google Play)."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ./gradlew :app:bundleRelease --no-daemon
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Envoyer sur Google Play (test interne)
        if: steps.release.outputs.signed == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.izimboa.livreur
          releaseFiles: mobile/livreur-android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
