name: Déploiement VPS

# Déploie sur le serveur : Caddy, PostgreSQL, Keycloak et l'API.
# Se lance quand l'infrastructure ou le code de l'API change sur main (après les tests de l'API).
on:
  push:
    branches: [main]
    paths:
      - "infra/vps/**"
      - "infra/keycloak-theme/**"
      - "backend/**"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  VPS_HOST: 212.47.78.167
  VPS_USER: deploy
  VPS_DIR: /srv/izimboa

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests de l'API (on ne déploie jamais une API qui échoue)
        run: ./gradlew test --no-daemon

  deploy:
    needs: test-api
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration Compose
        run: |
          printf 'POSTGRES_SUPERUSER_PASSWORD=x\nIZIMBOA_DB_PASSWORD=x\nKEYCLOAK_DB_PASSWORD=x\nKEYCLOAK_ADMIN_PASSWORD=x\n' > infra/vps/.env
          docker compose -f infra/vps/compose.yaml config -q
          rm infra/vps/.env

      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image de l'API
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: izimboa-api:latest,izimboa-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Préparer la connexion SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Le secret VPS_SSH_KEY n'est pas défini (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp infra/vps/known_hosts ~/.ssh/known_hosts

      - name: Envoyer l'image de l'API sur le serveur
        run: docker save izimboa-api:latest izimboa-api:${{ github.sha }} | gzip | ssh "$VPS_USER@$VPS_HOST" 'gunzip | docker load'

      - name: Copier les fichiers sur le serveur
        run: |
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=yes" \
            infra/vps/compose.yaml infra/vps/deploy.sh infra/vps/backup.sh infra/vps/caddy infra/vps/site infra/vps/postgres infra/vps/keycloak \
            infra/keycloak-theme \
            "$VPS_USER@$VPS_HOST:$VPS_DIR/"

      # Clé Brevo (secret GitHub BREVO_API_KEY) recopiée dans le .env du serveur, transmise par l'entrée standard
      # (jamais dans une ligne de commande ni dans les journaux). Sans secret : rien ne change.
      - name: Clé Brevo vers le serveur
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          if [ -n "$BREVO_API_KEY" ]; then
            printf '%s' "$BREVO_API_KEY" | ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
              'cd /srv/izimboa && K=$(cat) && umask 077 && touch .env && sed -i "/^BREVO_API_KEY=/d" .env && printf "BREVO_API_KEY=%s\n" "$K" >> .env && echo "Clé Brevo à jour."'
          else
            echo "Pas de secret BREVO_API_KEY : e-mails seulement inscrits au journal."
          fi

      - name: Relancer les services
        run: ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "bash $VPS_DIR/deploy.sh"

      - name: Vérifier que tout répond
        run: |
          echo "Attente de l'API et de Keycloak (jusqu'à 4 minutes)..."
          for i in $(seq 1 48); do
            api=$(curl -s -o /dev/null -w '%{http_code}' https://api.izimboa.com/health || true)
            kc=$(curl -s -o /dev/null -w '%{http_code}' https://auth.izimboa.com/realms/izimboa/.well-known/openid-configuration || true)
            echo "essai $i : api=$api auth=$kc"
            if [ "$api" = "200" ] && [ "$kc" = "200" ]; then break; fi
            sleep 5
          done
          curl -fsS https://api.izimboa.com/health; echo
          curl -fsS https://api.izimboa.com/v1/delivery/zones; echo
          curl -fsS https://auth.izimboa.com/realms/izimboa/.well-known/openid-configuration | grep -o '"issuer":"[^"]*"'
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.izimboa.com/v1/me)
          echo "/v1/me sans jeton -> $code"; [ "$code" = "401" ]
          # delivery.izimboa.com est vérifié par deploy-delivery-web.yml.
          for d in go fly buy; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$d.izimboa.com/")
            echo "$d.izimboa.com -> $code"; [ "$code" = "200" ]
          done

      - name: En cas d'échec, journaux du serveur
        if: failure()
        run: |
          ssh "$VPS_USER@$VPS_HOST" "cd $VPS_DIR && docker compose ps && docker compose logs --tail=60 api"
          ssh "$VPS_USER@$VPS_HOST" "cd $VPS_DIR && docker compose logs --tail=400 keycloak | grep -E 'ERROR|FATAL|Caused by|Exception' | head -60"
