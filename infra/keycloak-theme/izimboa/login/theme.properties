# Thème de connexion Izimboa : basé sur le thème officiel « keycloak.v2 » (mis à jour avec Keycloak),
# seule l'apparence est personnalisée (CSS, logo, polices). Aucun gabarit HTML n'est recopié.
parent=keycloak.v2
import=common/keycloak
# Le nom du fichier CSS porte sa date : les feuilles de style sont gardées 30 jours en cache devant le serveur
# (Cloudflare), un nouveau nom force le chargement de la nouvelle version. Changer la date à chaque modification.
styles=css/styles.css css/izimboa-2026-11-04.css
darkMode=false
