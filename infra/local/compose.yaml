# Izimboa — environnement de développement local
#
#   cd infra/local
#   cp .env.example .env        # une seule fois
#   docker compose up -d
#
# Services et adresses :
#   PostgreSQL ........ localhost:5432   (bases : izimboa, keycloak)
#   Redis ............. localhost:6379
#   RabbitMQ .......... localhost:5672   console : http://localhost:15672
#   Keycloak .......... http://localhost:8081   (realm « izimboa »)
#   Mailpit ........... http://localhost:8025   (boîte mail de test, SMTP localhost:1025)
#
# Le port 8080 reste libre pour l'API Spring Boot.
# Usage local uniquement : mots de passe de développement, Keycloak en mode « dev ».

name: izimboa

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      IZIMBOA_DB_PASSWORD: ${IZIMBOA_DB_PASSWORD:-izimboa}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      TZ: Africa/Douala
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d izimboa"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    hostname: izimboa-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-izimboa}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-izimboa}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.0
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      TZ: Africa/Douala
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # L'image Keycloak n'a pas curl : requête HTTP via bash sur le port de gestion (9000).
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
